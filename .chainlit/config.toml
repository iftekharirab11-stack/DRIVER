[project]
user_env = []
session_timeout = 3600
user_session_timeout = 3600
enable_database = "local"
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.discord]
enabled = false

[features.slack]
enabled = false

[features.spontaneous_file_upload]
enabled = true
accept = ["*/*"]
max_files = 20
max_size_mb = 500

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.sse]
enabled = true

[features.mcp.streamable-http]
enabled = true

[features.mcp.stdio]
enabled = true
allowed_executables = [ "npx", "uvx" ]

[UI]
name = "Alpha SaaS"
cot = "full"
alert_style = "classic"
confirm_new_chat = true
hide_side_menu = false
default_collapse_content = false

[meta]
generated_by = "2.11.1"